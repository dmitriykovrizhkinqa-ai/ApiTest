name: API Tests with Allure Report

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./ApiTestFramework

    - name: Run API tests with Allure results
      run: dotnet test --no-restore --logger "console;verbosity=detailed"
      working-directory: ./ApiTestFramework

    - name: Find and upload Allure results
      if: always()
      run: |
        ALLURE_PATH=$(find ./ApiTestFramework -type d -name "allure-results" | head -1)
        echo "Found allure-results at: $ALLURE_PATH"
        echo "ALLURE_PATH=$ALLURE_PATH" >> $GITHUB_ENV
      shell: bash

    - name: Upload Allure results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: ${{ env.ALLURE_PATH }}
        retention-days: 5

  generate-report:
    needs: run-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Allure results
      uses: actions/download-artifact@v4
      with:
        name: allure-results
        path: allure-results

    - name: Generate Allure Report
      if: always()
      uses: allure-framework/allure-report-action@v2
      with:
        results-path: allure-results
        report-path: allure-report

    - name: Deploy report to GitHub Pages
      if: ${{ always() && success() }}
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./allure-report
        destination_dir: builds/tests
