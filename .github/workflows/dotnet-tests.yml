name: API Tests with Allure Report

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./ApiTestFramework

    - name: Run API tests with Allure results
      run: dotnet test --no-restore --logger "console;verbosity=detailed" --results-directory ./TestResults --collect:"XPlat Code Coverage" --settings coverlet.runsettings
      working-directory: ./ApiTestFramework

    - name: Upload Allure results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: ./ApiTestFramework/TestResults/**/allure-results
        retention-days: 5

  generate-report:
    needs: run-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Allure results
      uses: actions/download-artifact@v4
      with:
        name: allure-results
        path: allure-results

    - name: Generate Allure Report
      uses: andgineer/allure-report@v3.6
      if: always()
      id: allure-report
      with:
        allure-results: allure-results
        reports-site-path: builds/tests

    - name: Deploy report to GitHub Pages
      if: ${{ always() && steps.allure-report.outcome == 'success' }}
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ${{ steps.allure-report.outputs.reports-site }}
        destination_dir: ${{ steps.allure-report.outputs.reports-site-path }}
